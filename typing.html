<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assyrian Keyboarding 101 Typing Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Syriac+Eastern&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Noto Sans Syriac Eastern', sans-serif;
    background-color: #f9f9f9;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
}
h1 { margin-bottom: 20px; }
#text-box {
    border: 2px solid #ddd;
    padding: 20px;
    width: 80%;
    min-height: 150px;
    font-size: 24px;
    line-height: 2;
    background-color: #fff;
    border-radius: 10px;
}
#text-box span.correct { color: green; }
#text-box span.incorrect { color: red; }
#text-box span.current { background-color: #e0f7fa; }
#input-box {
    margin-top: 20px;
    width: 80%;
    font-size: 24px;
    padding: 10px;
    border-radius: 5px;
    border: 2px solid #ccc;
}
.stats {
    margin-top: 15px;
    font-size: 18px;
}
button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background-color: #87ceeb;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background-color: #00bfff; }
#custom-container { display: none; margin-top: 15px; width: 80%; }
#custom-text { width: 100%; height: 80px; font-size: 20px; padding: 10px; border-radius: 5px; border: 2px solid #ccc; }
</style>
</head>
<body>

<h1>Assyrian Keyboarding 101 Typing Test</h1>

<label for="difficulty">Select difficulty:</label>
<select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
    <option value="custom">Custom</option>
</select>
<button id="shuffle">Shuffle</button>

<div id="custom-container">
    <textarea id="custom-text" placeholder="Enter your own text..."></textarea>
</div>

<div id="text-box"></div>
<input type="text" id="input-box" placeholder="Start typing...">

<div class="stats">
    WPM: <span id="wpm">0</span> | Accuracy: <span id="accuracy">0</span>% | Time: <span id="time">0</span>s
</div>

<script>
// ===============================
// DATA BANKS
// ===============================
const easyWords = "ܢܘܼܢܵܐ ܟܸܦܬܹ̈ܐ ܪܸܙܵܐ ܛܠܲܦ̮ܚܹ̈ܐ ܟܘܼܒܹ̈ܐ ܟܬܵܝܬܵܐ ܦ̮ܲܬܘܼܫ ܛܘܼܪ̈ܫܝܹܐ ܒܸܤܪܵܐ ܡܝܼܵܐ ܒܸܥܹ̈ܐ ܟܸܪܬܘܿܦܹ̈ܐ ܟ̰ܵܐܝ ܓܸܠܵܠܹ̈ܐ ܤܲܠܵܛܵܐ ܡܝܼܵܐ ܕܚܲܒܘܼܫܹ̈ܐ ܝܲܪ̈ܩܹܐ ܥܸܪܒܵܐ ܡܝܼܵܐ ܕܠܝܼܡܘܿܢܹ̈ܐ (ܚܲܡܘܼܨܵܐ) ܐܸܒܒܵܢܹ̈ܐ ܕܘܿܠܡܵܐ ܡܝܼܵܐ ܕܦܘܼܪܬܵܩܵܠܹ̈ܐ (ܐܸܛܪܘܿܓܵܐ) ܚܲܒܘܼܫܵܐ ܒܲܡܝܵܐ ܡܝܼܵܐ ܕܪܘܼܡܵܢܹ̈ܐ ܡܘܼܙܵܐ ܡܵܫܹ̈ܐ ܫܬܵܝܬܵܐ ܒܲܩܒܸܩܵܢܵܐ ܬܲܡܪܹ̈ܐ ܒܘܼܫܵܠܵܐ ܕܲܘܹ̈ܐ ܪܸܙܵܐ ܤܡܘܿܩܵܐ ܦ̮ܵܠܵܦ̮ܸܠ ܬܵܘܪܵܐ ܤܡܘܿܩܵܐ ܪܸܙܵܐ ܒܚܲܪܛܡܵܢܹ̈ܐ ܟܵܒܵܒܹ̈ܐ ܡܝܼܵܐ ܒܲܩܒܸܩܵܢܵܐ ܡܲܟܕܘܼܤ ܡܲܩܠܘܼܒܹܐ ܚܲܠܒ̣ܵܐ ܒܵܕܸܡܓ̰ܵܢ ܡܲܤܬܵܐ ܩܲܗܘܵܐ ܒܵܕܸܡܓ̰ܵܢܹ̈ܐ ܓܪܝܼܤܹܐ ܚܲܒ̣ܨܹ̈ܐ ܚܲܪܛܡܵܢܹ̈ܐ ܓܪܝܼܤܹܐ ܒܘܼܪܲܟ".split(" ");

const mediumSentences = "ܫܠܵܡܵܐ! ܡܘܿܕܝܼ ܒܸܕ ܛܵܠܒܹܬ؟ ܡܘܿܕܝܼ ܒܸܕ ܫܵܬܹܝܬ؟ ܡܘܿܕܝܼ ܒܸܕ ܐܵܟ̣ܠܹܬ؟ ܚܲܕ ܡܸܢܕܝܼ ܐ݇ܚܹܪ݇ܢܵܐ؟ ܗܵܘܹܝܬ ܒܲܤܝܼܡܵܐ! ܐܵܢܵܐ ܒܵܥܹܝܢ... ܐܝܼܬ ܠܘܿܟܼ... ܐܵܢܵܐ ܒܸܕ ܐܵܟ̣ܠܹܢ... ܐܵܢܵܐ ܒܸܕ ܫܵܬܹܝܢ...".split("? ").map(s=>s+"?");

const hardSentences = [
"ܚܲܕ ܝܵܘܡܵܐ ܪܵܒܝܼ ܤܲܪܓܘܼܠ ܩܝܼܡ ܠܹܗ ܘܐ݇ܡܝܼܪ ܠܹܗ ܩܵܐ ܓܵܢܹܗ.",
"ܪܵܒܵܐ ܟܦܝܼܢܵܐ ܝܼܘܸܢ... ܐܲܝܟܵܐ ܡܵܨܹܝܢ ܐܵܙܹܠ݇ܢ ܩܵܐ ܕܐܵܟ̣ܠܹܢ ܟܵܘܸܬܪܵܐ؟",
"ܠܵܐ ܫܩܝܼܠ ܠܵܗ̇ ܪܵܒܵܐ ܬܲܚܡܲܢܬܵܐ ܩܵܐ ܪܵܒܝܼ ܤܲܪܓܘܼܠ.",
"ܒܸܕ ܐܵܙܹܠ ܠܚܕܵܐ ܕܘܼܟܬܵܐ ܕܪܵܒܵܐ ܟܹܐ ܡܲܚܸܒ...",
"ܐܝܼܢܵܐ ܩܲܕ݇ܡ ܐܵܗܵܐ ܒܸܕ ܩܵܪܹܐ ܩܵܐ ܚܲܒ̣ܪܹܗ ܤܬܘܼܐܸܪܬ ܩܵܐ ܕܐܵܬܹܐ ܡܸܢܹܗ.",
"ܩܲܝܕܲܡܬܵܟ̣ܝܼ ܒܪܝܼܟ̣ܬܵܐ ܪܘܿܡܝܼ.",
"ܫܠܵܡܵܐ ܓܪܵܝܤ.",
"ܩܵܐ ܡܘܿܕܝܼ ܝܼܘܵܬܝ ܓܵܘ ܫܘܼܩܵܐ ܐܸܕܝܘܿܡ؟"
];

// ===============================
// ELEMENTS
// ===============================
const difficultySelect = document.getElementById('difficulty');
const shuffleBtnEl = document.getElementById('shuffle');

let currentText = [];
let currentIndex = 0;
let totalTyped = 0;
let correctTyped = 0;
let startTime = null;
let timerInterval;

// ===============================
// FUNCTIONS
// ===============================
function pickText() {
    let mode = difficultySelect.value;
    if(mode === 'easy') {
        currentText = randomSubset(easyWords, 6);
    } else if(mode === 'medium') {
        currentText = randomSubset(mediumSentences, 2);
    } else if(mode === 'hard') {
        currentText = randomSubset(hardSentences, 3);
    } else if(mode === 'custom') {
        currentText = customText.value.split(/\n/).filter(t=>t.trim().length>0);
    }
    renderText();
    resetStats();
}

function renderText() {
    textBox.innerHTML = '';
    currentText.forEach((word,index)=>{
        const span = document.createElement('span');
        span.textContent = word + " ";
        if(index===0) span.classList.add('current');
        textBox.appendChild(span);
    });
    currentIndex = 0;
    inputBox.value = '';
    inputBox.focus();
}

function resetStats() {
    totalTyped = 0;
    correctTyped = 0;
    startTime = new Date();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateStats,1000);
}

function updateStats() {
    let elapsed = Math.floor((new Date()-startTime)/1000);
    let wordsTyped = totalTyped/5;
    let wpm = Math.round((wordsTyped/(elapsed/60))||0);
    let accuracy = Math.round((correctTyped/totalTyped*100)||0);
    wpmSpan.textContent = wpm;
    accSpan.textContent = accuracy;
    timeSpan.textContent = elapsed;
}

function randomSubset(arr,count) {
    return arr.slice().sort(()=>Math.random()-0.5).slice(0,count);
}

// ===============================
// EVENTS
// ===============================
shuffleBtnEl.addEventListener('click',()=>pickText());

difficultySelect.addEventListener('change',()=>{
    if(difficultySelect.value==='custom') {
        customContainer.style.display='block';
    } else {
        customContainer.style.display='none';
        pickText();
    }
});

inputBox.addEventListener('input',(e)=>{
    let span = textBox.querySelectorAll('span')[currentIndex];
    let typed = inputBox.value.trim();
    totalTyped++;
    if(normalize(typed) === normalize(currentText[currentIndex])) {
        span.classList.add('correct');
        span.classList.remove('incorrect');
        correctTyped++;
    } else {
        span.classList.remove('correct');
        span.classList.add('incorrect');
    }
});

inputBox.addEventListener('keydown',(e)=>{
    if(e.key===' ' || e.key==='Enter') {
        e.preventDefault();
        let typed = inputBox.value.trim();
        let span = textBox.querySelectorAll('span')[currentIndex];
        if(normalize(typed) === normalize(currentText[currentIndex])) {
            span.classList.add('correct');
            span.classList.remove('current');
            currentIndex++;
            if(currentIndex<currentText.length) {
                textBox.querySelectorAll('span')[currentIndex].classList.add('current');
            } else {
                clearInterval(timerInterval);
            }
            inputBox.value='';
        }
    }
});

function normalize(str) { return str.replace(/\u200c/g,"").replace(/\s+/g," ").trim(); }

// ===============================
// INIT
// ===============================
pickText();
</script>

</body>
</html>
