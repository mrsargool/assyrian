<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assyrian Keyboarding 101 Typing Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Syriac+Eastern&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Noto Sans Syriac Eastern', sans-serif;
  background: #f9f9f9;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

h1 { margin-bottom: 15px; }

#text-display {
  border: 2px solid #ccc;
  padding: 20px;
  width: 90%;
  max-width: 900px;
  height: 220px;
  overflow-y: auto;
  margin-bottom: 15px;
  direction: rtl;
  background: #fff;
  border-radius: 10px;
  line-height: 2;
  font-size: 22px;
  transition: background 0.3s;
}

.word { margin: 0 6px; white-space: nowrap; }
.current { background: #e0f7fa; border-radius: 3px; padding: 0 2px; }
.correct-letter { color: #4caf50; }
.incorrect-letter { color: #f44336; }
.current-letter { text-decoration: underline; text-decoration-color: #2196f3; }

#typing-input {
  width: 90%;
  max-width: 900px;
  font-size: 20px;
  padding: 10px;
  direction: rtl;
  text-align: right;
  border-radius: 8px;
  border: 2px solid #ccc;
  margin-bottom: 10px;
}

#controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }

button, select { padding: 10px 15px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; }
button:hover, select:hover { opacity: 0.9; }

#progress-container { width: 90%; max-width: 900px; height: 12px; background: #ddd; border-radius: 6px; margin: 15px 0; }
#progress { height: 12px; background: #4caf50; width: 0%; border-radius: 6px; transition: width 0.3s; }

#stats { display: flex; gap: 20px; margin: 10px 0; font-size: 16px; flex-wrap: wrap; justify-content: center; }

#custom-text-container { display: none; margin-bottom: 10px; }

#score-screen {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #fff;
  border-radius: 8px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
}

</style>
</head>
<body>
<h1>Assyrian Keyboarding 101 Typing Test</h1>

<div id="text-display"></div>

<div id="custom-text-container">
  <textarea id="custom-text" placeholder="ܟܬܘܿܒ̣ ..." style="width: 90%; max-width:900px; height:80px; font-family: 'Noto Sans Syriac Eastern'; direction: rtl;"></textarea>
</div>

<input id="typing-input" type="text" placeholder="...ܟܬܘܿܒ̣" disabled>

<div id="controls">
  <button id="start-btn">Start</button>
  <button id="end-btn">End</button>
  <button id="shuffle-btn">Shuffle</button>
  <select id="mode-select">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
    <option value="custom">Custom</option>
  </select>
</div>

<div id="progress-container">
  <div id="progress"></div>
</div>

<div id="stats">
  <div>Time: <span id="time">0:00</span></div>
  <div>WPM: <span id="wpm">0</span></div>
  <div>Live WPM: <span id="liveWpm">0</span></div>
  <div>Accuracy: <span id="accuracy">100</span>%</div>
  <div>Errors: <span id="errors">0</span></div>
  <div>Streak: <span id="streak">0</span></div>
</div>

<div id="score-screen"></div>

<script>
// Word banks
const easyBank = ["ܢܘܼܢܵܐ","ܟܸܦܬܹܐ","ܪܸܙܵܐ","ܛܠܲܦ̮ܚܹ̈ܐ","ܟܘܼܒܹ̈ܐ","ܟܬܵܝܬܵܐ","ܦ̮ܲܬܘܼܫ","ܛܘܼܪܹ̈ܫܝܹܐ","ܒܸܤܪܵܐ","ܡܝܼܵܐ","ܒܸܥܹ̈ܐ","ܟܸܪܬܘܿܦܹ̈ܐ","ܟܵܐܝ","ܓܸܠܵܠܹ̈ܐ","ܣܲܠܵܛܵܐ"];
const mediumBank = ["ܫܠܵܡܵܐ! ܡܘܿܕܝܼ ܒܸܕ ܛܵܠܒܹܬ؟","ܡܘܿܕܝܼ ܒܸܕ ܫܵܬܹܝܬ؟","ܡܘܿܕܝܼ ܒܸܕ ܐܵܟ̣ܠܹܬ؟","ܚܲܕ ܡܸܢܕܝܼ ܐ݇ܚܹܪ݇ܢܵܐ؟","ܗܵܘܹܝܬ ܒܲܤܝܼܡܵܐ!"];
const hardBank = ["ܚܲܕ ܝܵܘܡܵܐ ܪܵܒܝܼ ܣܲܪܓܘܼܠ ܩܝܼܡ ܠܹܗ ܘܐ݇ܡܝܼܪ ܠܹܗ ܩܵܐ ܓܵܢܹܗ","ܩܲܝܕܲܡܬܵܟ̣ܝܼ ܒܪܝܼܟ̣ܬܵܐ ܪܘܿܡܝܼ"];

// State
let currentWords = [], currentWordIndex = 0;
let startTime, elapsedTime = 0, timerInterval;
let totalTyped = 0, correctTyped = 0, errors = 0, streak = 0;
let isRunning = false;

const textDisplay = document.getElementById('text-display');
const typingInput = document.getElementById('typing-input');
const modeSelect = document.getElementById('mode-select');
const shuffleBtn = document.getElementById('shuffle-btn');
const startBtn = document.getElementById('start-btn');
const endBtn = document.getElementById('end-btn');
const progressBar = document.getElementById('progress');
const timeEl = document.getElementById('time');
const wpmEl = document.getElementById('wpm');
const liveWpmEl = document.getElementById('liveWpm');
const accuracyEl = document.getElementById('accuracy');
const errorsEl = document.getElementById('errors');
const streakEl = document.getElementById('streak');
const scoreScreen = document.getElementById('score-screen');
const customTextContainer = document.getElementById('custom-text-container');
const customTextInput = document.getElementById('custom-text');

// Shuffle helper
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// Load words
function loadText(){
  const mode = modeSelect.value;
  if(mode==='easy') currentWords = shuffleArray([...easyBank]).slice(0,6);
  else if(mode==='medium') currentWords = shuffleArray([...mediumBank]).slice(0,3);
  else if(mode==='hard') currentWords = shuffleArray([...hardBank]).slice(0,3);
  else if(mode==='custom') currentWords = customTextInput.value.trim().split(/\s+/);
  currentWordIndex = 0;
  streak = 0;
  renderText();
}

function renderText(){
  textDisplay.innerHTML='';
  currentWords.forEach((word,i)=>{
    const span=document.createElement('span');
    span.className='word';
    for(let c of word){
      const letter=document.createElement('span');
      letter.textContent=c.replace('ܤ','ܣ');
      span.appendChild(letter);
    }
    if(i===currentWordIndex) span.classList.add('current');
    textDisplay.appendChild(span);
  });
  textDisplay.scrollTop=0;
}

// Progress
function updateProgress(){
  progressBar.style.width=(currentWordIndex/currentWords.length)*100+'%';
}

// Start
function startTest(){
  loadText();
  elapsedTime=0; totalTyped=0; correctTyped=0; errors=0;
  updateStats();
  isRunning=true;
  typingInput.disabled=false;
  typingInput.value='';
  typingInput.focus();
  startTime=Date.now();
  timerInterval=setInterval(()=> {
    elapsedTime=(Date.now()-startTime)/1000;
    const min=Math.floor(elapsedTime/60);
    const sec=Math.floor(elapsedTime%60);
    timeEl.textContent=`${min}:${sec<10?'0':''}${sec}`;
    const liveWPM = elapsedTime>0?Math.round(correctTyped/(elapsedTime/60)):0;
    liveWpmEl.textContent = liveWPM;
  },1000);
  scoreScreen.style.display='none';
}

// End
function endTest(){
  isRunning=false;
  clearInterval(timerInterval);
  typingInput.disabled=true;
  scoreScreen.style.display='block';
  const acc=totalTyped>0?Math.round(correctTyped/totalTyped*100):100;
  const wpm=elapsedTime>0?Math.round(correctTyped/(elapsedTime/60)):0;
  scoreScreen.innerHTML=`<h2>Test Finished!</h2><p>WPM: ${wpm}</p><p>Accuracy: ${acc}%</p><p>Errors: ${errors}</p><p>Max Streak: ${streak}</p>`;
}

// Typing
typingInput.addEventListener('input', ()=>{
  if(!isRunning) return;
  const currentWord=currentWords[currentWordIndex];
  const inputVal=typingInput.value;
  totalTyped++;

  const wordSpan=textDisplay.children[currentWordIndex];

  // Highlight letters
  for(let i=0;i<wordSpan.children.length;i++){
    const letterSpan=wordSpan.children[i];
    if(i<inputVal.length){
      if(inputVal[i]===currentWord[i]){
        letterSpan.className='correct-letter';
      } else {
        letterSpan.className='incorrect-letter';
      }
    } else {
      letterSpan.className='';
    }
  }
  if(inputVal.length<wordSpan.children.length) wordSpan.children[inputVal.length].classList.add('current-letter');

  // Error if space but word not complete
  if(inputVal.endsWith(' ') && inputVal.trim()!==currentWord){
    errors++;
    typingInput.value='';
    streak=0;
    updateStats();
    return;
  }

  // Word complete
  if(inputVal.trim()===currentWord){
    correctTyped++;
    streak++;
    currentWordIndex++;
    typingInput.value='';
    wordSpan.classList.remove('current');
    updateProgress();
    if(currentWordIndex<currentWords.length){
      textDisplay.children[currentWordIndex].classList.add('current');
      textDisplay.scrollTop = textDisplay.children[currentWordIndex].offsetTop - textDisplay.offsetTop;
    } else {
      endTest();
    }
  }

  updateStats();
});

function updateStats(){
  const acc=totalTyped>0?Math.round(correctTyped/totalTyped*100):100;
  const wpm=elapsedTime>0?Math.round(correctTyped/(elapsedTime/60)):0;
  wpmEl.textContent=wpm;
  accuracyEl.textContent=acc;
  errorsEl.textContent=errors;
  streakEl.textContent=streak;
}

// Disable copy/paste
typingInput.addEventListener('paste', e=>{ e.preventDefault(); });

startBtn.addEventListener('click', startTest);
endBtn.addEventListener('click', endTest);
shuffleBtn.addEventListener('click', loadText);
modeSelect.addEventListener('change', ()=>{customTextContainer.style.display=(modeSelect.value==='custom')?'block':'none';});

loadText();
</script>
</body>
</html>
